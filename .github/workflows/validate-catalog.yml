name: Validate Creative Universe catalog
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check projects.js
          node --check app.js
      - name: Validate direct-app links and project cards
        run: node scripts/validate-catalog.mjs
